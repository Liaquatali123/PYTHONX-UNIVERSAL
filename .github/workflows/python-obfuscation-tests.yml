name: Python obfuscation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-obfuscation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install python-minifier==3.4.0 pytest
      - name: Run obfuscation regression tests
        run: python -m pytest -q tests/test_obfuscation.py
